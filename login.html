<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Iniciar Sesión - Jardinería El Edén</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Roboto, Arial, sans-serif;
            height: 100vh;
            overflow: hidden;
        }

        .login-container {
            display: flex;
            height: 100vh;
            width: 100%;
        }

        .login-left {
            flex: 1;
            background: linear-gradient(rgba(0, 80, 0, 0.55), rgba(0, 60, 0, 0.65)),
                        url('https://images.unsplash.com/photo-1416879595882-3373a0480b5b?q=80&w=2070&auto=format&fit=crop') center/cover no-repeat;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 45px 50px;
            color: #fff;
            position: relative;
        }

        .login-left::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 80, 0, 0.30);
            pointer-events: none;
        }

        .login-left .brand {
            display: flex;
            align-items: center;
            gap: 12px;
            font-size: 1.6rem;
            font-weight: 600;
            z-index: 1;
            position: relative;
        }

        .login-left .brand-icon {
            font-size: 2rem;
        }

        .login-left .bottom-text {
            z-index: 1;
            position: relative;
        }

        .login-left .bottom-text h1 {
            font-size: 2.8rem;
            font-weight: 700;
            line-height: 1.2;
            margin-bottom: 12px;
            text-shadow: 0 2px 10px rgba(0, 0, 0, 0.3);
        }

        .login-left .bottom-text p {
            font-size: 1.1rem;
            font-weight: 400;
            opacity: 0.95;
            text-shadow: 0 2px 8px rgba(0, 0, 0, 0.3);
        }

        .login-right {
            flex: 1;
            background: #f5f7fa;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 40px;
        }

        .login-form-card {
            background: #ffffff;
            border-radius: 14px;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.08);
            padding: 45px 40px;
            width: 100%;
            max-width: 420px;
        }

        .login-form-card h2 {
            text-align: center;
            font-size: 1.7rem;
            color: #1a2a3a;
            margin-bottom: 8px;
            font-weight: 700;
        }

        .login-form-card .subtitle {
            text-align: center;
            font-size: 0.9rem;
            color: #7a8b9c;
            margin-bottom: 30px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            font-size: 0.88rem;
            font-weight: 600;
            color: #1a2a3a;
            margin-bottom: 6px;
        }

        .form-group input {
            width: 100%;
            padding: 13px 16px;
            border: 1px solid #dce3ec;
            border-radius: 8px;
            font-size: 0.95rem;
            background: #f8f9fb;
            transition: 0.2s;
            color: #1a2a3a;
        }

        .form-group input::placeholder {
            color: #a0aeba;
        }

        .form-group input:focus {
            outline: none;
            border-color: #2e7d32;
            background: #fff;
            box-shadow: 0 0 0 3px rgba(46, 125, 50, 0.10);
        }

        .login-form-card .forgot-link {
            display: block;
            text-align: left;
            font-size: 0.85rem;
            color: #2e7d32;
            text-decoration: none;
            margin-bottom: 25px;
            font-weight: 500;
        }

        .login-form-card .forgot-link:hover {
            text-decoration: underline;
        }

        .login-form-card .btn-login {
            width: 100%;
            padding: 14px;
            background: #1a8a3a;
            color: #fff;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: 0.2s;
        }

        .login-form-card .btn-login:hover {
            background: #14702e;
        }

        @media (max-width: 900px) {
            .login-left {
                display: none;
            }

            .login-right {
                flex: 1;
            }

            .login-form-card {
                padding: 35px 25px;
            }
        }

        @media (max-width: 480px) {
            .login-right {
                padding: 20px;
            }

            .login-form-card {
                padding: 30px 20px;
            }

            .login-form-card h2 {
                font-size: 1.4rem;
            }
        }
    </style>
</head>
<body>

    <div class="login-container">

        <div class="login-left">
            <div class="brand">
                <span class="brand-icon">🌿</span>
                <span>Jardinería El Edén</span>
            </div>

            <div class="bottom-text">
                <h1>Bienvenido a tu paraíso verde</h1>
                <p>Gestiona tu negocio de jardinería de manera eficiente y profesional</p>
            </div>
        </div>

        <div class="login-right">
            <div class="login-form-card">
                <h2>Iniciar Sesión</h2>
                <p class="subtitle">Ingresa tus credenciales para acceder al sistema</p>

                <form id="loginForm">
                    <div class="form-group">
                        <label for="email">Correo Electrónico</label>
                        <input type="email" id="email" placeholder="usuario@ejemplo.com" required />
                    </div>

                    <div class="form-group">
                        <label for="password">Contraseña</label>
                        <input type="password" id="password" placeholder="••••••••" required />
                    </div>

                    <a href="#" class="forgot-link">Contacte a un administrador</a>

                    <button type="submit" class="btn-login">Iniciar Sesión</button>
                </form>
            </div>
        </div>

    </div>
    
         JAVASCRIPT - VALIDACIÓN DE LOGIN
         
    <script>
        document.getElementById('loginForm').addEventListener('submit', function(e) {
            e.preventDefault();

            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value.trim();

            // Credenciales válidas para el ingreso como administrador 
            const usuarioValido = 'admin@eleden.com';
            const passwordValido = 'admin123';

            // Validación
            if (email === usuarioValido && password === passwordValido) {
                // Login exitoso
                window.location.href = 'dashboard.html';
            } else {
                // Login fallido
                window.location.href = 'error-login.html';
            }
        });
    </script>

</body>
</html>
